name: Deploy AI Aircraft Maintenance Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aircraft-maintenance-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

      BACKEND_REPOSITORY: ${{ secrets.BACKEND_REPOSITORY }}
      FRONTEND_REPOSITORY: ${{ secrets.FRONTEND_REPOSITORY }}

      EKS_ACCESS_POLICY_ARN: arn:aws:eks::aws:cluster-access-policy/AmazonEKSAdminPolicy

    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ----------------------------------------------------
      # AWS OIDC Authentication
      # ----------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      # ----------------------------------------------------
      # Verify AWS Authentication
      # ----------------------------------------------------

      - name: Verify AWS Identity
        run: |
          set -e

          echo "AWS Account:"
          aws sts get-caller-identity

          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo "EKS Cluster:"
          echo "${EKS_CLUSTER_NAME}"

      # ----------------------------------------------------
      # Verify ECR Repositories
      # ----------------------------------------------------

      - name: Verify ECR Repositories
        run: |
          set -e

          aws ecr describe-repositories \
            --repository-names "${BACKEND_REPOSITORY}" \
            --region "${AWS_REGION}"

          aws ecr describe-repositories \
            --repository-names "${FRONTEND_REPOSITORY}" \
            --region "${AWS_REGION}"

      # ----------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------------------
      # Generate immutable image tag
      # ----------------------------------------------------

      - name: Set Image Variables
        run: |
          set -e

          IMAGE_TAG="${GITHUB_SHA}"

          BACKEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPOSITORY}:${IMAGE_TAG}"
          FRONTEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"

          echo "Backend image:"
          echo "${BACKEND_IMAGE}"

          echo "Frontend image:"
          echo "${FRONTEND_IMAGE}"

      # ----------------------------------------------------
      # Build Backend
      # ----------------------------------------------------

      - name: Build Backend Image
        run: |
          set -e

          docker build \
            -f ./backend/Dockerfile \
            -t "maintenance-backend:${IMAGE_TAG}" \
            ./backend

      # ----------------------------------------------------
      # Tag Backend Image
      # ----------------------------------------------------

      - name: Tag Backend Image
        run: |
          set -e

          docker tag \
            "maintenance-backend:${IMAGE_TAG}" \
            "${BACKEND_IMAGE}"

      # ----------------------------------------------------
      # Push Backend
      # ----------------------------------------------------

      - name: Push Backend Image
        run: |
          set -e

          docker push "${BACKEND_IMAGE}"

      # ----------------------------------------------------
      # Build Frontend
      # ----------------------------------------------------

      - name: Build Frontend Image
        run: |
          set -e

          docker build \
            -f ./frontend/Dockerfile \
            -t "maintenance-frontend:${IMAGE_TAG}" \
            ./frontend

      # ----------------------------------------------------
      # Tag Frontend Image
      # ----------------------------------------------------

      - name: Tag Frontend Image
        run: |
          set -e

          docker tag \
            "maintenance-frontend:${IMAGE_TAG}" \
            "${FRONTEND_IMAGE}"

      # ----------------------------------------------------
      # Push Frontend
      # ----------------------------------------------------

      - name: Push Frontend Image
        run: |
          set -e

          docker push "${FRONTEND_IMAGE}"

      # ----------------------------------------------------
      # Prepare EKS Access Entries
      #
      # This is intentionally automated so no manual AWS CLI
      # commands are required. The GitHub Actions role creates
      # its own STANDARD access entry if one does not exist,
      # and associates AmazonEKSAdminPolicy if needed.
      # ----------------------------------------------------

      - name: Configure EKS Access for GitHub Actions
        run: |
          set -euo pipefail

          PRINCIPAL_ARN="${AWS_ROLE_ARN}"
          CLUSTER_NAME="${EKS_CLUSTER_NAME}"
          REGION="${AWS_REGION}"
          ACCESS_POLICY_ARN="${EKS_ACCESS_POLICY_ARN}"

          echo "Checking EKS authentication mode..."

          AUTH_MODE="$(aws eks describe-cluster \
            --name "${CLUSTER_NAME}" \
            --region "${REGION}" \
            --query 'cluster.accessConfig.authenticationMode' \
            --output text)"

          echo "Current EKS authentication mode: ${AUTH_MODE}"

          if [ "${AUTH_MODE}" = "CONFIG_MAP" ]; then
            echo "Access entries are not enabled. Switching to API_AND_CONFIG_MAP..."

            aws eks update-cluster-config \
              --name "${CLUSTER_NAME}" \
              --region "${REGION}" \
              --access-config authenticationMode=API_AND_CONFIG_MAP

            echo "Waiting for EKS access-entry authentication mode..."

            for i in $(seq 1 60); do
              CURRENT_MODE="$(aws eks describe-cluster \
                --name "${CLUSTER_NAME}" \
                --region "${REGION}" \
                --query 'cluster.accessConfig.authenticationMode' \
                --output text)"

              if [ "${CURRENT_MODE}" = "API_AND_CONFIG_MAP" ] || [ "${CURRENT_MODE}" = "API" ]; then
                echo "EKS authentication mode is now: ${CURRENT_MODE}"
                break
              fi

              echo "Current mode: ${CURRENT_MODE}; waiting..."
              sleep 10
            done

            CURRENT_MODE="$(aws eks describe-cluster \
              --name "${CLUSTER_NAME}" \
              --region "${REGION}" \
              --query 'cluster.accessConfig.authenticationMode' \
              --output text)"

            if [ "${CURRENT_MODE}" != "API_AND_CONFIG_MAP" ] && [ "${CURRENT_MODE}" != "API" ]; then
              echo "ERROR: EKS access-entry authentication mode was not enabled."
              exit 1
            fi
          fi

          echo "Checking access entry for:"
          echo "${PRINCIPAL_ARN}"

          if aws eks describe-access-entry \
              --cluster-name "${CLUSTER_NAME}" \
              --principal-arn "${PRINCIPAL_ARN}" \
              --region "${REGION}" >/dev/null 2>&1; then
            echo "EKS access entry already exists."
          else
            echo "Creating EKS STANDARD access entry..."

            aws eks create-access-entry \
              --cluster-name "${CLUSTER_NAME}" \
              --principal-arn "${PRINCIPAL_ARN}" \
              --type STANDARD \
              --region "${REGION}"

            echo "EKS access entry created."
          fi

          echo "Checking EKS access policy association..."

          ASSOCIATED_POLICY_COUNT="$(aws eks list-associated-access-policies \
            --cluster-name "${CLUSTER_NAME}" \
            --principal-arn "${PRINCIPAL_ARN}" \
            --region "${REGION}" \
            --query "associatedAccessPolicies[?policyArn=='${ACCESS_POLICY_ARN}'] | length(@)" \
            --output text)"

          if [ "${ASSOCIATED_POLICY_COUNT}" = "1" ]; then
            echo "AmazonEKSAdminPolicy is already associated."
          else
            echo "Associating AmazonEKSAdminPolicy..."

            aws eks associate-access-policy \
              --cluster-name "${CLUSTER_NAME}" \
              --principal-arn "${PRINCIPAL_ARN}" \
              --policy-arn "${ACCESS_POLICY_ARN}" \
              --access-scope type=cluster \
              --region "${REGION}"

            echo "AmazonEKSAdminPolicy associated."
          fi

      # ----------------------------------------------------
      # Configure kubectl
      # ----------------------------------------------------

      - name: Configure kubectl
        run: |
          set -e

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      # ----------------------------------------------------
      # Verify EKS Access
      # ----------------------------------------------------

      - name: Verify EKS Access
        run: |
          set -e

          echo "Current Kubernetes context:"
          kubectl config current-context

          echo "EKS cluster:"
          kubectl cluster-info

          echo "Current Kubernetes identity:"
          kubectl auth whoami

          echo "Nodes:"
          kubectl get nodes

      # ----------------------------------------------------
      # Update Backend Manifest
      # ----------------------------------------------------

      - name: Update Backend Manifest
        run: |
          set -e

          sed -i \
            "s|\${BACKEND_IMAGE}|${BACKEND_IMAGE}|g" \
            kubernetes/backend-deployment.yaml

      # ----------------------------------------------------
      # Update Frontend Manifest
      # ----------------------------------------------------

      - name: Update Frontend Manifest
        run: |
          set -e

          sed -i \
            "s|\${FRONTEND_IMAGE}|${FRONTEND_IMAGE}|g" \
            kubernetes/frontend-deployment.yaml

      # ----------------------------------------------------
      # Show manifests before deployment
      # ----------------------------------------------------

      - name: Verify Kubernetes Manifests
        run: |
          set -e

          echo "Backend image:"
          grep -n "image:" kubernetes/backend-deployment.yaml

          echo "Frontend image:"
          grep -n "image:" kubernetes/frontend-deployment.yaml

      # ----------------------------------------------------
      # Deploy
      # ----------------------------------------------------

      - name: Deploy to Amazon EKS
        run: |
          set -e

          kubectl apply -f kubernetes/

      # ----------------------------------------------------
      # Wait for Backend
      # ----------------------------------------------------

      - name: Wait for Backend
        run: |
          set -e

          kubectl rollout status \
            deployment/maintenance-backend \
            --timeout=5m

      # ----------------------------------------------------
      # Wait for Frontend
      # ----------------------------------------------------

      - name: Wait for Frontend
        run: |
          set -e

          kubectl rollout status \
            deployment/maintenance-frontend \
            --timeout=5m

      # ----------------------------------------------------
      # Verify Deployment
      # ----------------------------------------------------

      - name: Verify Deployment
        run: |
          set -e

          echo "Deployments:"
          kubectl get deployments

          echo "Pods:"
          kubectl get pods -o wide

          echo "Services:"
          kubectl get svc

      # ----------------------------------------------------
      # Verify Pods Are Running
      # ----------------------------------------------------

      - name: Verify Pod Status
        run: |
          set -e

          kubectl get pods

          if kubectl get pods --no-headers | grep -E 'CrashLoopBackOff|ImagePullBackOff|ErrImagePull'; then
            echo "ERROR: One or more pods have failed."
            exit 1
          fi
