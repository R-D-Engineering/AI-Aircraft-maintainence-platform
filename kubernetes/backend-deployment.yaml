# -----------------------------------------------------------------------------
# Backend Deployment
#
# A Deployment ensures the desired number of backend pods are always running.
# If a pod crashes, Kubernetes automatically recreates it.
# -----------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment

metadata:
  name: maintenance-backend
  labels:
    app: maintenance-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: maintenance-backend

  template:
    metadata:
      labels:
        app: maintenance-backend

    spec:
      serviceAccountName: maintenance-backend
      containers:
        - name: maintenance-backend
          # Docker image stored in Amazon ECR
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: BEDROCK_MODEL_ID
              value: amazon.nova-pro-v1:0
          ports:
            - containerPort: 8000
